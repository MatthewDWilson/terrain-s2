# Stage 1 profile for New Zealand: CRS, elevation sources, LINZ layers, GeoFabrics overrides.
# A profile is data; a new country or region gets a new file (location agnosticism, T1).
name: nz
crs:
  horizontal: 2193          # NZTM 2000
  vertical: 7839            # NZVD2016
elevation:
  # LINZ nz-elevation (public S3, COGs, static STAC). Collections: <region>/<survey>/<product>_1m/2193/.
  stac_root: https://nz-elevation.s3-ap-southeast-2.amazonaws.com/
  products: {dem: dem_1m, dsm: dsm_1m}
  # The national mosaic (one item per 1:50k sheet, dated by its newest input) is fill only, never the
  # chosen survey (DESIGN_NOTES section 9 item 8). Whether a matching national DSM exists is open.
  national:
    dem: new-zealand/new-zealand/dem_1m/2193/collection.json
  # Survey slugs that take priority over newest-first, in order (a newer survey is not always better).
  priority: []
  # Survey slugs never used.
  exclude: []
  nodata: -9999
land:
  topo50_coastline: 51153   # Topo50 coastline polygons (MHW)
  topo50_mangrove: 50296    # Topo50 mangrove polygons
  clip_buffer_m: 100
geofabrics:
  # OpenTopography dataset name -> {horizontal: EPSG, vertical: EPSG}, only for surveys whose LAZ headers
  # are known to be wrong (plan 6.3 step 3). Nothing is forced to 2193+7839 otherwise.
  crs_overrides: {}
  # OpenTopography datasets never used (e.g. federated, or superseded).
  exclude: []
  # Restrict discovery to OpenTopography-hosted point clouds (those geoapis can fetch from pc-bulk).
  hosted_only: true
# GeoFabrics river bed estimation (TERRAIN_GF_RIVERS / request "rivers": true; stage1/rivers.py). REC2 has no
# flows per reach, so the network is NIWA's "NZ Flood Statistics (Henderson Collins) on REC1" (Matt, 14 Oct
# 2026; layer Flood_Statistics_2018_REC1, probed with the step script's 'rec1' mode). It has no node fields: the
# topology is built from the reach geometry. Flow: the mean annual flood (bank-full proxy).
rivers:
  network:
    source: {kind: arcgis, url: 548b3bfcff8f4728b0f64caf6f815233}   # ArcGIS Online item; or {kind: file, path: ...}
    columns: {id: NZREACH, area: Areakm2, flow: H_C18_MAF, from_node: null, to_node: null, mannings_n: null}
    area_units: km2
    mannings_n: 0.035        # used while columns.mannings_n is null (GeoFabrics' Waikanae reaches: 0.03-0.04)
    margin_m: 1000           # network fetched for the grid plus this margin; reaches clipped to it
    node_tolerance_m: 1      # reach ends this close share a node (topology from geometry)
  area_threshold_m2: 10000000   # main channels: upstream area at least 10 km2
  max_rivers: 5
  z_label: bed_elevation_Rupp_and_Smart   # or bed_elevation_Neal_et_al (both written by GeoFabrics)
  parameters: {}           # overrides for templates/rivers.json "rivers" keys (widths, bank heights, corridor)
  osm: {}                  # {<network_id>: {type: way, id: <OSM id>}} to align a river to that OSM waterway
waterways:
  parameters: {}           # overrides for templates/waterways.json "waterways" keys
