# Terrain worker overlay (integration plan 9.2). Adds one service to an EDDIE deployment; it does not copy the
# core compose file. From the deployment folder (FReDT, Smart Ideas, ...):
#
#   docker compose -f docker-compose.yml -f <terrain-s2>/compose/terrain-worker.yml up -d
#   (v5 deployments with the D9 networks also add -f <terrain-s2>/compose/terrain-worker.v5-networks.yml)
#
# TERRAIN_S2_DIR: path of the terrain-s2 checkout relative to the deployment folder (default lib/terrain-s2,
# beside lib/eddie). No host ports (D9). Products go to the shared stored_data volume under /stored_data/terrain;
# downloads and snapshots (LAZ tiles, COG item indexes, vector snapshots) to the terrain_data volume.
volumes:
  terrain_data:

services:
  terrain_worker:
    build:
      context: ${TERRAIN_S2_DIR:-lib/terrain-s2}
      dockerfile: docker/terrain-worker.Dockerfile
      args:
        EDDIE_REF: ${EDDIE_REF:-v4.0.0}
        TERRAIN_VERSION: ${TERRAIN_VERSION:-0.0.0+compose}
    image: eddie-terrain-worker:${TERRAIN_VERSION:-latest}
    restart: always
    env_file:
      - .env
      - api_keys.env
      - .env.docker-override
    environment:
      TERRAIN_DATA_DIR: /terrain_data
      TERRAIN_PRODUCT_DIR: /stored_data/terrain
      TERRAIN_WORKER_CONCURRENCY: ${TERRAIN_WORKER_CONCURRENCY:-1}
      TERRAIN_GF_MEMORY_LIMIT: ${TERRAIN_GF_MEMORY_LIMIT:-8GiB}
      TERRAIN_GF_CORES: ${TERRAIN_GF_CORES:-2}
    volumes:
      - stored_data:/stored_data
      - terrain_data:/terrain_data
    healthcheck:
      test: curl --fail -s http://localhost:5001/ || exit 1
      interval: 30s
      timeout: 25s
      retries: 10
    depends_on:
      - db_postgres
      - message_broker
    deploy:
      resources:
        limits:
          # a full LINZ tile needs about 9 GB for Stage 2; GeoFabrics memory is TERRAIN_GF_MEMORY_LIMIT x cores
          memory: ${TERRAIN_WORKER_MEMORY:-24g}
