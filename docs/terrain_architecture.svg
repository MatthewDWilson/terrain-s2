<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 760 760" role="img" aria-label="The stages meet only through the DEM contract" font-size="13"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4b2a7"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1b">The stages meet only through the DEM contract</text><g><rect x="24" y="56" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="124" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1b">OpenTopography</text><text x="124" y="98" text-anchor="middle" font-size="11.5" fill="#5f5d57">point clouds (LAZ)</text></g><g><rect x="240" y="56" width="248" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="364" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1b">LINZ 1 m DEM and DSM</text><text x="364" y="98" text-anchor="middle" font-size="11.5" fill="#5f5d57">STAC catalogue, COG tiles</text></g><g><rect x="504" y="56" width="232" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="620" y="80" text-anchor="middle" font-weight="600" fill="#1f1e1b">Vector sources</text><text x="620" y="98" text-anchor="middle" font-size="11.5" fill="#5f5d57">LINZ WFS, councils, OSM</text></g><g><rect x="240" y="144" width="496" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="488" y="168" text-anchor="middle" font-weight="600" fill="#1f1e1b">Shared acquire (both stages)</text><text x="488" y="186" text-anchor="middle" font-size="11.5" fill="#5f5d57">elevation reader, vector cache, snapshot store</text></g><g><rect x="24" y="232" width="416" height="120" rx="8" fill="#f1efe8" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="40" y="252" font-weight="600" fill="#1f1e1b">Stage 1</text><rect x="40" y="264" width="184" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="132" y="288" text-anchor="middle" font-weight="600" fill="#1f1e1b">GeoFabrics backend</text><text x="132" y="306" text-anchor="middle" font-size="11.5" fill="#5f5d57">pinned 1.1.30, templates</text><text x="132" y="322" text-anchor="middle" font-size="11.5" fill="#5f5d57">optional; adds zo</text><rect x="240" y="264" width="184" height="72" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="332" y="288" text-anchor="middle" font-weight="600" fill="#1f1e1b">Raster backend</text><text x="332" y="306" text-anchor="middle" font-size="11.5" fill="#5f5d57">bypasses GeoFabrics</text><text x="332" y="322" text-anchor="middle" font-size="11.5" fill="#5f5d57">area average to 2 to 8 m</text></g><g><rect x="472" y="232" width="264" height="120" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="604" y="258" text-anchor="middle" font-weight="600" fill="#1f1e1b">Stage 2 (terrain-s2, 1 m)</text><text x="604" y="282" text-anchor="middle" font-size="11.5" fill="#5f5d57">channels and crossings</text><text x="604" y="300" text-anchor="middle" font-size="11.5" fill="#5f5d57">structures layer</text><text x="604" y="318" text-anchor="middle" font-size="11.5" fill="#5f5d57">honest and burned DEMs</text></g><text x="612" y="221" font-size="11.5" fill="#5f5d57">Input B: LINZ 1 m</text><g><rect x="24" y="392" width="416" height="56" rx="8" fill="#2c7be5" fill-opacity="0.12" stroke="#2c7be5" stroke-width="2"></rect><text x="232" y="416" text-anchor="middle" font-weight="600" fill="#1f1e1b">DEM contract</text><text x="232" y="434" text-anchor="middle" font-size="11.5" fill="#1f1e1b">netCDF (z, data_source, lidar_source) + COG + provenance</text></g><text x="528" y="392" font-size="11.5" fill="#5f5d57">Input A: Stage 1 at 1 m</text><g><rect x="24" y="488" width="416" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="232" y="512" text-anchor="middle" font-weight="600" fill="#1f1e1b">Option 1: DEM at 1, 2, 4 or 8 m</text><text x="232" y="530" text-anchor="middle" font-size="11.5" fill="#5f5d57">what FReDT and Smart Ideas use today</text></g><g><rect x="472" y="488" width="264" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="604" y="512" text-anchor="middle" font-weight="600" fill="#1f1e1b">Options 2A and 2B (1 m)</text><text x="604" y="530" text-anchor="middle" font-size="11.5" fill="#5f5d57">structures, channels, two DEMs</text></g><g><rect x="24" y="584" width="712" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="380" y="608" text-anchor="middle" font-weight="600" fill="#1f1e1b">eddie_terrain (terrain worker, queue terrain)</text><text x="380" y="626" text-anchor="middle" font-size="11.5" fill="#5f5d57">registers products by generator key and serves them to EDDIE</text></g><g><rect x="24" y="680" width="712" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b4b2a7" stroke-width="1.25"></rect><text x="380" y="704" text-anchor="middle" font-weight="600" fill="#1f1e1b">Consumers</text><text x="380" y="722" text-anchor="middle" font-size="11.5" fill="#5f5d57">FReDT and Smart Ideas through the terrain_s2.client shim; later, Stage 3 model grids</text></g><g fill="none" stroke="#b4b2a7" stroke-width="1.25"><path d="M364 112V144" marker-end="url(#arch-arrow)"></path><path d="M620 112V144" marker-end="url(#arch-arrow)"></path><path d="M132 112V264" marker-end="url(#arch-arrow)"></path><path d="M332 200V264" marker-end="url(#arch-arrow)"></path><path d="M604 200V232" marker-end="url(#arch-arrow)"></path><path d="M132 336V392" marker-end="url(#arch-arrow)"></path><path d="M332 336V392" marker-end="url(#arch-arrow)"></path><path d="M440 420H520V352" marker-end="url(#arch-arrow)"></path><path d="M232 448V488" marker-end="url(#arch-arrow)"></path><path d="M700 352V488" marker-end="url(#arch-arrow)"></path><path d="M232 544V584" marker-end="url(#arch-arrow)"></path><path d="M604 544V584" marker-end="url(#arch-arrow)"></path><path d="M380 640V680" marker-end="url(#arch-arrow)"></path></g></svg>
