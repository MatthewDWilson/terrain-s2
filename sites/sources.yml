# Source registry for scripts/build_site.py. Verified 7 Oct 2026 unless marked otherwise
# (Waimakariri: verified by a live layer query, after a cached page proved stale).
# kind: arcgis (REST layer URL or ArcGIS Hub item id <32 hex>_<layer>), linz_wfs (needs LINZ_API_KEY),
# osm (Overpass), file (a local vector file). Mapping keys: see src/terrain_s2/acquire/harmonise.py.
sources:
  waimakariri_culverts:
    kind: arcgis
    # 8 Oct 2026: the open-data portal's "Stormwater Culvert Facility Pipe and Network Main" item
    # (openmaps-waimakariri.hub.arcgis.com, item 9ab2c4f660dd4dc4a6b3a1ab3efea019_14) is served from
    # Assets_Stormwater/MapServer/14; Matt's Stormwater_Pipes.shp is a download of it. Layer 13 is the same data
    # styled by criticality. The Before U Dig layer (BUD_Query/10) holds no culverts (DESIGN_NOTES §7b).
    url: https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/Assets_Stormwater/MapServer/14
    fallback_urls:
      - https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/Assets_Stormwater/MapServer/13
    # CLASSIFICATION2 is 'Pipe' for every row; the type is in CLASSIFICATION3 ('Network Main', 'Culvert',
    # 'Facility Pipe'): 980 culverts district-wide in the export.
    where: "CLASSIFICATION3 = 'Culvert'"
    layer: crossings
    const: {type: culvert}
    fields: {length_m: LENGTH_m}
    scale: {diameter_m: [DIAMETER_mm, 0.001], height_m: [HEIGHT_mm, 0.001]}
    # ASSET_ID is the new asset system's key; Legacy_ID holds the old SW numbers (kept in the _raw layer)
    id_field: [ASSET_ID, ASSNBRI]
    scope: >-
      council asset register: council and some private culverts (e.g. SW005886 under SH1, 'Private');
      most private driveway and farm culverts absent
  waimakariri_channels:
    kind: arcgis
    # 8 Oct 2026: Assets_Stormwater/3 (Stormwater Channel) matches BUD_Query/12 in canterbury1 (45 features, same
    # CLASSIFICATION3 values) and has the same schema and ids as the culverts; BUD_Query is the fallback.
    url: https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/Assets_Stormwater/MapServer/3
    fallback_urls:
      - https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/BUD_Query/MapServer/12
    layer: channels
    const: {exists: y}
    class_map: {field: CLASSIFICATION3, values: {Network Drain: drain, Receiving Waterway: stream, Water Race: race, Process Channel: other}}
    # 17 Oct 2026 probe (ML-3 widths): TOP_WIDTH_m, BASE_WIDTH_m, WIDTH_m and CHANNEL_FORM exist but are empty on all
    # 3,174 features of waves 1+2 (DEPTH_m on a handful); mapped so that values flow through if the council fills them
    scale: {width_m: [TOP_WIDTH_m, 1.0], base_width_m: [BASE_WIDTH_m, 1.0]}
    id_field: [ASSET_ID, ASSNBRI]
    scope: council scheme channels (33 council, 12 private in canterbury1); most roadside and private drains absent
  waimakariri_pipes:
    kind: arcgis
    url: https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/Assets_Stormwater/MapServer/14
    where: "CLASSIFICATION3 <> 'Culvert'"
    layer: pipes
    id_field: [ASSET_ID, ASSNBRI]
    enabled: false
    note: piped network (mains, facility pipes); context only, enable when needed
  waimakariri_structures:
    kind: arcgis
    # the old service is withdrawn; Assets_Stormwater 20/21/22 are "Stormwater Structure" point/line/polygon (to check)
    url: https://gisservices.waimakariri.govt.nz/arcgis/rest/services/3Waters/Assets_Stormwater/MapServer/20
    layer: structures
    id_field: [ASSET_ID, ASSNBRI]
    enabled: false
    note: headwalls, vehicle bridges, weirs etc.; field values to be checked before mapping (R4)
  es_drainage:
    kind: arcgis
    # Environment Southland "ES Drainage Network" (Public/General/MapServer/27), polylines, EPSG:2193;
    # fields (8 Oct, from the layer page): Name, District, Catchment, OperationalArea, SmartId, maintenance
    # schedule fields. No stream/drain class field: class left empty until the values are checked.
    url: https://maps.es.govt.nz/server/rest/services/Public/General/MapServer/27
    layer: channels
    const: {exists: y}
    # 17 Oct 2026 probe: no width, depth, form or class field (Name, District, Catchment, maintenance schedule);
    # widths fall back to the physics channel map, then the drain default (ml/config/channels.yml)
    id_field: [SmartId, GlobalID, OBJECTID]
    scope: regional council drainage scheme network (Southland); probe before use
  es_stopbanks:
    kind: arcgis
    # Environment Southland "ES Flood Protection Network" (Public/General/MapServer/28), polylines;
    # fields: ReachID, Scheme, River, Bank, ReachPurpose, UrbanRural, Catchment, OperationalArea.
    url: https://maps.es.govt.nz/server/rest/services/Public/General/MapServer/28
    layer: stopbanks
    const: {type: stopbank}
    id_field: [ReachID, OBJECTID]
    scope: regional flood protection reaches (Southland); ReachPurpose values to check (may include non-stopbank reaches)
  auckland_channels:
    kind: arcgis
    url: 6c4196567eae4cd48f1c071911fe4105_0      # ArcGIS Hub item, Auckland Council Stormwater Channel
    layer: channels
    const: {class: drain, exists: y}
    # 17 Oct 2026 probe: SW_WIDTH_TOP_MM (~1 % filled) and SW_WIDTH_BASE_MM (~4 %), integers in mm; many base widths
    # are 1-3 "mm" (metres entered in a mm field?): ML-3 drops widths outside its plausible range, no unit guessing.
    # SW_ASSET_TYPE gives the form (12,142 features in waves 1+2: UNLI 9,107, LINE 1,658, SWAL 1,296, FLUM 71, CONS 5).
    scale: {width_m: [SW_WIDTH_TOP_MM, 0.001], base_width_m: [SW_WIDTH_BASE_MM, 0.001]}
    class_map: {field: SW_ASSET_TYPE, target: form, values: {UNLI: unlined, LINE: lined, SWAL: swale, FLUM: flume}}
    id_field: [SW_GIS_ID, GlobalID_1, OBJECTID]
    scope: constructed channels only (explicitly not stream water) - drain labels, no stream labels
  canterbury_threewaters:
    kind: arcgis
    url: 268050a3ebee4fc3861b88122e5b6771_0      # ECan item; layer index for stormwater pipelines to confirm
    layer: pipes
    enabled: false
    note: regional consolidated nodes and pipelines (monthly), no open channels; Waimakariri not included at release
  kiwirail_culverts:
    kind: arcgis
    # 8 Oct 2026 (Matt): national KiwiRail culvert points, ArcGIS Online, EPSG:3857 (the query asks for 2193/4326).
    # Fields: ASSETNUM, KRSTARTOFF (metreage), MATERIAL, FORM, WIDTH, DEPTH, HEIGHT, DIAMETER, LENGTH,
    # NUMBARRELS, TLA_NAME. Units from the canterbury1 probe (8 Oct, 5 culverts, all concrete pipes):
    # DIAMETER 450-1300, so mm; DEPTH 1.9-4.2, so m (probably cover or fill depth: kept in the _raw layer);
    # KRSTARTOFF 21.77-21.96 is the line metreage in km. WIDTH, HEIGHT, LENGTH, NUMBARRELS empty there.
    url: https://services6.arcgis.com/eqX2HMCD3H8MUs6Q/arcgis/rest/services/Culverts_KiwiRail_/FeatureServer/0
    layer: crossings
    const: {type: culvert}
    scale: {diameter_m: [DIAMETER, 0.001]}
    id_field: ASSETNUM
    scope: culverts under the rail network (points, one per structure)
  kiwirail_track:
    kind: arcgis
    url: TODO
    layer: rail
    enabled: false
    note: KiwiRail Track Centreline exists (data.govt.nz KiwiRail harvest); service URL still to resolve
  linz_roads:
    kind: linz_wfs
    layer_id: 50329                               # NZ Road Centrelines (Topo, 1:50k)
    layer: roads
    const: {class: road}
    fields: {surface: surface, lanes: lane_count}
    id_field: t50_fid
  linz_tracks:
    kind: linz_wfs
    layer_id: 50364                               # NZ Track Centrelines (Topo, 1:50k)
    layer: tracks
    const: {class: track}
    id_field: t50_fid
  linz_rail:
    kind: linz_wfs
    layer_id: 50319                               # NZ Railway Centrelines (Topo, 1:50k)
    layer: rail
    fields: {status: status}
    id_field: t50_fid
  linz_buildings:
    kind: linz_wfs
    layer_id: 101290                              # NZ Building Outlines (from LINZ aerial imagery, >= 10 m2)
    layer: buildings
    fields: {use: use}
    id_field: building_id
  linz_coastline:
    kind: linz_wfs
    layer_id: 51153                               # NZ Coastline Polygons (Topo, 1:50k), mean high water
    # Stage 1 land masks (stage1/land.py fetches it through linz_wfs and the snapshot store); not used
    # in Stage 2 bundles (S2-10).
    layer: coastline
    id_field: t50_fid
    enabled: false
    scope: Stage 1 land mask only
  linz_mangrove:
    kind: linz_wfs
    layer_id: 50296                               # NZ Mangrove Polygons (Topo, 1:50k)
    layer: mangrove
    id_field: t50_fid
    enabled: false
    scope: Stage 1 land mask only (with linz_coastline)
  linz_bridges:
    kind: linz_wfs
    layer_id: 50244                               # NZ Bridge Centrelines (Topo, 1:50k)
    # bridges carrying roads, rail, tracks and pipelines over water or other obstacles: positive examples
    # for the bridge class (1:50k positions; small bridges are often missing). Kept as their own label layer,
    # not crossings, so this national layer does not put every tile in the crossings pool.
    layer: bridges
    const: {type: bridge}
    id_field: t50_fid
  linz_embankments:
    kind: linz_wfs
    layer_id: 50266                               # NZ Embankment Centrelines (Topo, 1:50k)
    # "an artificial bank of earth and or stone built above the natural surface": barrier context and weak
    # positives for raised features (1:50k selection, not complete)
    layer: embankments
    id_field: t50_fid
  linz_dams:
    kind: linz_wfs
    layer_id: 50260                               # NZ Dam Centrelines (Topo, 1:50k)
    layer: dams
    id_field: t50_fid
  ecan_stopbanks:
    kind: arcgis
    # Environment Canterbury, Flood Protection and Drainage Bylaw stopbanks. Layer 4 is the 2019 amendment,
    # layer 17 the 2013 original (probed 8 Oct 2026: 4 stopbanks in the canterbury1 window, TYPE 'Stopbanks',
    # SCHEME 'WEC', LENGTH_M; 540 features in 115 LINZ tiles). Layer 4 not yet probed: same schema expected.
    url: https://gis.ecan.govt.nz/arcgis/rest/services/Public/PlanningZones/MapServer/4
    fallback_urls:
      - https://gis.ecan.govt.nz/arcgis/rest/services/Public/PlanningZones/MapServer/17
    layer: stopbanks
    const: {type: stopbank}
    id_field: [OBJECTID]
    scope: ECan scheme stopbanks (regional council works); private and district stopbanks absent
  # ---- ML wave 3, first tranche (17 Oct 2026): entries moved from sites/candidates/sources_candidates.yml
  # (probe findings in their comments; assessment in docs/council_data_candidates.md)
  waikato_lds_drains:
    kind: arcgis
    # WRC Land Drainage Schemes - Drains (RACS_LDS_DRAIN; Hub item d7ddc3c738b246218dc52bcbfd99600c), CC BY 4.0,
    # modified 31 Jul 2026. 1,477 lines, all ASSET_TYPE Drain; DRAINAGE_SCHEME Waikato Central 746, Thames Valley 501,
    # Franklin Waikato 182, Aka Aka/Otaua 48; PURPOSE/STATUS Drainage/Existing 1,396, NOT SPECIFIED/Existing 62,
    # Pumping/Existing 12, Stopbank/Existing 4, Drainage/Disposed 3. The where keeps 1,470. No width/depth/form.
    # Probe 16 Oct confirmed; SPATIAL_DATA_ACCURACY mostly empty, 55 'Hand digitised - lidar', 24 from aerial photo.
    url: https://services.arcgis.com/2bzQ0Ix3iO7MItUa/arcgis/rest/services/WDP_RACS_LDS_DRAIN/FeatureServer/0
    where: "STATUS <> 'Disposed' AND PURPOSE <> 'Stopbank'"
    layer: channels
    const: {exists: y, class: drain}
    id_field: [ASSET_ID, OBJECTID]
    enabled: true
    scope: >-
      WRC-managed rural land-drainage scheme drains (lower Waikato, Thames Valley/Piako, Franklin, Aka Aka);
      scheme drains only, private and farm drains absent; Hauraki Plains drains are Hauraki DC's (hauraki_land_drains)
  wrc_floodgates:
    kind: arcgis
    # same service, layer 1 Floodgate (points). A floodgate is a culvert through a stopbank with a flap on its outlet:
    # a crossing for the scorer. Probe 2: 486 points; DISTRICT Lower Waikato 309, Waihou Piako 147, Lake Taupo 25,
    # Coromandel 5; FUNCTIONALREPORTING Flood Protection 453, Land Drainage 32. No size, type or owner fields
    # (UNITTYPE empty). The where keeps the two lowland zones.
    url: https://maps.waikatoregion.govt.nz/arcgis/rest/services/WRCMAPS/Flood_protection_and_land_drainage_assets/MapServer/1
    where: "DISTRICT IN ('Zone - Lower Waikato', 'Zone - Waihou Piako')"
    layer: crossings
    const: {type: culvert}
    id_field: [COMPKEY, OBJECTID]
    enabled: true
    scope: WRC scheme floodgates in the lower Waikato and Waihou-Piako (Hauraki Plains) zones (456)
  hauraki_land_drains:
    kind: arcgis
    # Hauraki DC Land Drain (Asset-Finda; Hub item 179257d036914fe3a6ccf7d7e30fdbfc), CC BY 4.0. 776 lines:
    # Land Drain 721 (Material = drain class: Type A 98, B 298, C 145, O 173, X 7), Stopbank 52, Culvert 3.
    # DIAMETER on drains is a code per class (A 1, B 2, C 3, O 6, X 15): possibly a nominal width, unconfirmed,
    # so not mapped. Community = drainage district (18, e.g. Kerepehi, Turua, Mackaytown, Waihi).
    # Probe 16 Oct confirmed; US/DS_Invert all 0; layer served in EPSG:3857 (the query asks for 2193).
    url: https://services9.arcgis.com/ph39VKR5KFKf0WbU/arcgis/rest/services/Land_Drain/FeatureServer/0
    where: "Asset_Type = 'Land Drain'"
    layer: channels
    const: {exists: y, class: drain}
    id_field: [Asset_ID, FID]
    enabled: true
    scope: >-
      Hauraki DC drainage-district drains (Hauraki Plains, Paeroa, Waihi); council-maintained, private drains absent;
      drain class A/B/C/O/X in Material (meaning to confirm with HDC)
  otago_scheduled_drains:
    kind: arcgis
    # ORC Flood Protection Management Bylaw 2022, Scheduled Drains (item d9542addf2184fec938a5792ec12924c), CC BY 4.0.
    # 317 lines: West Taieri 97, Lower Clutha 81, East Taieri 74, Tokomairiro 65. Fields: label (drain number),
    # Location. No class, width or pipe field. No public ORC culvert layer found.
    url: https://services6.arcgis.com/ALxeDxaeNjQo1Mf0/arcgis/rest/services/Flood_Protection_Management_Bylaw_2022/FeatureServer/1
    layer: channels
    const: {exists: y, class: drain}
    id_field: [label, OBJECTID]
    enabled: true
    scope: ORC scheme drains scheduled in the bylaw (Taieri Plain, Lower Clutha, Tokomairiro); private drains absent
  gisborne_rural_drains:
    kind: arcgis
    # Gisborne DC Rural Drains (item 55765e67974c4fd38661f68f89ab4bcc), CC BY 4.0, modified Jul 2023. 325 lines:
    # UNITTYPE DRAIN 283, STREAM 22, RIVER 19, DIVERSION 1. Fields: COMPKEY, UNITTYPE, Name.
    url: https://services7.arcgis.com/8G10QCd84QpdcTJ9/arcgis/rest/services/rural_drains/FeatureServer/0
    layer: channels
    const: {exists: y}
    class_map: {field: UNITTYPE, values: {DRAIN: drain, DIVERSION: drain, STREAM: stream, RIVER: stream}}
    id_field: [COMPKEY, OBJECTID]
    enabled: true
    scope: council-owned public rural drains (Poverty Bay flats); private drains (landowner's) absent
  ecan_drains:
    kind: arcgis
    # ECan bylaw drains, the 2019 amendment layer (PlanningZones/3); entry from sites/candidates (ecan_bylaw_drains_2019). Only 560
    # lines: TYPE/CATEGORY Drain A 19, B 273, C 144; Modified waterway A 20, B 53; Natural waterway A 3, B 44;
    # Grassed waterway B 4. Has SCHEME (Ashburton Hinds Drainage 160, Halswell Drainage 143, Waimakariri-Eyre-Cust 52,
    # Kaikoura Drainage 48, Seadown 33, Clandeboye 33, ...) and CATEGORY. Likely only the drains the 2019 amendment
    # changed or added: compare ASSET_NO with layer 16 before choosing.
    # Probe 16 Oct: CATEGORY B 374, C 144, A 42; CLEANING filled on 176 (mechanical/spray); PLAN_ 'Topo' 16. One line
    # has LENGTH_M 3,339,652 (a 3,300 km artefact): the where drops it. Drains 436 + modified waterways 73 vs 432
    # drains in 2013: this looks like the current drain schedule, so prefer it for drains.
    # Probe 2: 559 selected, longest now 43.8 km; Drain 436, Modified waterway 73, Natural waterway 46, Grassed 4.
    url: https://gis.ecan.govt.nz/arcgis/rest/services/Public/PlanningZones/MapServer/3
    where: "LENGTH_M < 50000"
    layer: channels
    const: {exists: y}
    class_map: {field: TYPE, values: {Drain: drain, Modified waterway: drain, Natural waterway: stream, Grassed waterway: drain}}
    id_field: [ASSET_NO, OBJECTID]
    enabled: true
    scope: ECan bylaw drains (2019 amendment); scheme drains only
  boprc_defence_against_water:
    kind: arcgis
    # Bay of Plenty Regional Council "Defence Against Water". Probed 8 Oct 2026: the public layer holds only
    # 6 features, all stopbanks, returned without geometry. Not usable as published; ask BOPRC for the full layer.
    url: https://gis.boprc.govt.nz/server2/rest/services/BayOfPlentyMaps/PlansandRules/MapServer/1
    layer: stopbanks
    id_field: [Asset_ID, OBJECTID]
    enabled: false
    scope: not usable as published (6 features, no geometry)
  hbrc_stopbanks:
    kind: arcgis
    # Hawke's Bay Regional Council AssetManagement Asset Lines (MapServer/5, the open-data item
    # a8ddc32a1669447e8abf5fc04e1f9dc3_5). Probed 8 Oct 2026, 4,290 lines: Stopbank 601, Drain 572,
    # Culvert 176, River Channel 125, Bridge - Road 3, plus fences, trails, access, groynes. One source per
    # output layer, filtered on AssetType; Asset_Owner (HBRC, district councils, Waka Kotahi, private) kept raw.
    url: https://gis.hbrc.govt.nz/server/rest/services/ExternalServices/AssetManagement/MapServer/5
    where: "AssetType IN ('Stopbank', 'Deflection Bank', 'Unengineered Bund')"
    layer: stopbanks
    const: {type: stopbank}
    id_field: [OBJECTID]
    scope: HBRC-maintained flood protection banks
  hbrc_culverts:
    kind: arcgis
    url: https://gis.hbrc.govt.nz/server/rest/services/ExternalServices/AssetManagement/MapServer/5
    where: "AssetType = 'Culvert'"
    layer: crossings
    const: {type: culvert}
    id_field: [OBJECTID]
    scope: culverts maintained by HBRC (lines); district council and private culverts mostly absent
  hbrc_channels:
    kind: arcgis
    url: https://gis.hbrc.govt.nz/server/rest/services/ExternalServices/AssetManagement/MapServer/5
    where: "AssetType IN ('Drain', 'River Channel', 'Channel')"
    layer: channels
    const: {exists: y}
    class_map: {field: AssetType, values: {Drain: drain, River Channel: stream, Channel: other}}
    # 17 Oct 2026 probe: no width, depth or form field (Asset Lines: AssetType, SchemeName, River_StreamName, Material)
    id_field: [OBJECTID]
    scope: HBRC scheme drains and river channels
  hbrc_bridges:
    kind: arcgis
    url: https://gis.hbrc.govt.nz/server/rest/services/ExternalServices/AssetManagement/MapServer/5
    where: "AssetType = 'Bridge - Road'"
    layer: bridges
    const: {type: bridge}
    id_field: [OBJECTID]
    scope: road bridges maintained by HBRC (3 at 8 Oct 2026)
  hbrc_drains:
    kind: arcgis
    url: 9f0c4d8675c941159609cab92079fb79_3        # HBRC Drains (open data item); 739 features in 76 tiles
    layer: channels
    const: {exists: y}
    id_field: [OBJECTID]
    enabled: false
    scope: HBRC drainage scheme drains; compare with hbrc_channels (Asset Lines) before enabling, likely overlap
  rec2_rivers:
    kind: arcgis
    # NIWA (Earth Sciences NZ) River Environment Classification v2.5 river lines, national (593,218 segments in
    # 7,517 of the 7,657 LiDAR tiles). Derived from coarse elevation: channels are missing or misplaced, so NOT
    # for stream identification (Matt, 8 Oct 2026). Use for upstream area (CUM_AREA, m2) and flow statistics,
    # carried to our network only where a segment snaps to it (as GeoFabrics does). Probed fields: CUM_AREA,
    # CATAREA, StreamOrde (truncated name), nzsegment, NextDownID, upElev/downElev, segslpmean.
    url: https://services3.arcgis.com/fp1tibNcN9mbExhG/ArcGIS/rest/services/REC2_Layers/FeatureServer/0
    layer: rivers_rec2
    fields: {upstream_area_m2: CUM_AREA, catchment_area_m2: CATAREA, strahler: StreamOrde, next_down: NextDownID,
             up_x: upcoordX, up_y: upcoordY, down_x: downcoordX, down_y: downcoordY}
    id_field: [nzsegment, OBJECTID]
    scope: national river network from a coarse DEM; context only (upstream area, flows), not stream labels
  osm:
    kind: osm                                     # roads, rail, waterways, culverts (tunnel=culvert), buildings
    # a local extract when it exists (relative to TERRAIN_DATA_DIR; scripts/osm_extract.py converts Geofabrik's
    # new-zealand-latest.osm.pbf once), else Overpass (slow, and refusing parallel workers: wave 3, Oct 2026)
    extract: osm/new-zealand-osm.gpkg
