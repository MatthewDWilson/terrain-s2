# EDDIE terrain Stage 2 prototype — CPU environment (production servers, laptops).
#   conda env create -f environment.yml        # or: mamba env create -f environment.yml
#   conda activate terrain-s2
#   pytest
# conda-forge only, with strict channel priority, so GDAL/PROJ/CUDA libraries come
# from one build ecosystem. Lower bounds are what the code needs; the versions the
# prototype was tested with (pip, Sep 2026) are in DESIGN_NOTES.md. For an exact,
# reproducible environment, lock this file (conda-lock, see README).
# The package itself is NOT pip-installed here: tests and scripts use src/ directly.
# If you want it installed, use `pip install --no-deps -e .` so pip never pulls
# binary wheels (with their own GDAL/PROJ DLLs) into the conda environment.
name: terrain-s2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=2.0
  - affine
  - scipy>=1.13
  - numba>=0.60
  - pyflwdir>=0.5.10
  - scikit-image>=0.24
  - scikit-learn>=1.5           # rank_candidates.py
  - pyyaml                      # site definitions (scripts/build_site.py)
  - requests                    # data acquisition
  - rasterio>=1.4
  - geopandas>=1.0
  - shapely>=2.0
  - pyogrio
  - matplotlib-base
  - pytest
  - pip
  - pip:
      - whitebox-workflows>=2.0.6   # optional cross-check (Whitebox NG, MIT/Apache); PyPI wheel
