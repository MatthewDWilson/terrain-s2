# terrain-s2 (EDDIE terrain, Stages 1 and 2): CPU environment (servers, laptops, the workstation).
#   conda env create -f environment.yml        # or: mamba env create -f environment.yml
#   conda activate terrain-s2
#   pip install --no-deps -e .                  # the package and the `terrain` command (no wheels: keeps conda's GDAL)
#   pytest
# conda-forge only, with strict channel priority, so GDAL/PROJ/CUDA libraries come from one build ecosystem. Lower
# bounds are what the code needs; tested versions are in DESIGN_NOTES.md. For an exact, reproducible environment,
# lock this file (conda-lock, see README). Scripts and tests also run from src/ without the install.
# The GPU machine uses this file plus CuPy and PyTorch (docs/wsl/terrain_hpc.sh: setup, torch), or environment-gpu.yml.
name: terrain-s2
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=2.0
  - affine>=2.4,<4             # 4 may drop `*` composition, still used by rasterio and rioxarray
  - scipy>=1.13
  - numba>=0.60
  - pyflwdir>=0.5.10
  - scikit-image>=0.24
  - scikit-learn>=1.5           # rank_candidates.py
  - pyyaml                      # site definitions (scripts/build_site.py)
  - psutil                      # peak memory in run_network.py perf
  - requests                    # data acquisition
  - rasterio>=1.4
  - geopandas>=1.0
  - shapely>=2.0
  - pyogrio
  - matplotlib-base
  - xarray                      # Stage 1 products (netCDF contract) and the store
  - netcdf4
  - rioxarray
  - sqlalchemy                  # Stage 1 product registry (SQLite here, Postgres under EDDIE)
  - pyarrow                     # ML datasets (Parquet)
  - libgdal-netcdf              # GDAL's netCDF driver (reads of Stage 1 .nc products)
  - pytest
  - pyflakes                    # tests/test_static.py (undefined names)
  - pip
  - pip:
      - whitebox-workflows>=2.0.6   # optional cross-check (Whitebox NG, MIT/Apache); PyPI wheel
